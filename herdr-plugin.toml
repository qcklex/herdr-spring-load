id = "herdr-spring-load"
name = "herdr-spring-load"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Spring-loaded drag and drop: hover over spaces, tabs and panes while holding a file, then release to drop it"
platforms = ["macos"]

# Builds, signs and starts the helper, and adds the private keybindings.
# Transactional: a failure leaves the previous state in place.
[[build]]
command = ["sh", "scripts/build.sh"]
platforms = ["macos"]

[[actions]]
id = "probe-1"
title = "Spring-load client probe 1"
contexts = ["workspace"]
command = ["python3", "probe.py", "1"]

[[actions]]
id = "probe-2"
title = "Spring-load client probe 2"
contexts = ["workspace"]
command = ["python3", "probe.py", "2"]

[[actions]]
id = "probe-3"
title = "Spring-load client probe 3"
contexts = ["workspace"]
command = ["python3", "probe.py", "3"]

[[actions]]
id = "probe-4"
title = "Spring-load client probe 4"
contexts = ["workspace"]
command = ["python3", "probe.py", "4"]

[[actions]]
id = "probe-5"
title = "Spring-load client probe 5"
contexts = ["workspace"]
command = ["python3", "probe.py", "5"]

[[actions]]
id = "probe-6"
title = "Spring-load client probe 6"
contexts = ["workspace"]
command = ["python3", "probe.py", "6"]

[[actions]]
id = "probe-7"
title = "Spring-load client probe 7"
contexts = ["workspace"]
command = ["python3", "probe.py", "7"]

[[actions]]
id = "status"
title = "Spring-load helper status"
contexts = ["workspace"]
command = ["sh", "scripts/status.sh"]

[[actions]]
id = "remove-helper"
title = "Remove herdr-spring-load helper and keybindings (run before herdr plugin uninstall)"
contexts = ["workspace"]
command = ["sh", "helper/uninstall.sh"]

[[panes]]
id = "setup"
title = "Set up herdr-spring-load"
placement = "overlay"
command = ["sh", "scripts/build.sh", "--pause"]
