id = "herdr-spring-load"
name = "herdr-spring-load for Ghostty (macOS, tabs and panes)"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Ghostty on macOS only: hover over herdr tabs or panes while dragging a file to switch before dropping. Space switching is broken; Terminal.app, Warp and broader compatibility are work in progress."
platforms = ["macos", "linux", "windows"]

# Builds and checks this OS's sensor, installs the core and starts the login
# service. No OS permission, no config edits. Transactional. macOS compiles the
# sensor with swiftc; Linux needs only python3 (the sensor is a zipapp).
[[build]]
command = ["sh", "scripts/build.sh"]
platforms = ["macos", "linux"]

# Windows (experimental): no sh, so setup runs on the python found on PATH.
[[build]]
command = ["python", "-B", "setup.py"]
platforms = ["windows"]

[[actions]]
id = "status"
title = "Spring-load helper status"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["sh", "scripts/build.sh", "--status"]

[[actions]]
id = "remove-helper"
title = "Remove herdr-spring-load helper (run before herdr plugin uninstall)"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["sh", "helper/uninstall.sh"]

[[actions]]
id = "status-windows"
title = "Spring-load helper status (experimental on Windows)"
contexts = ["workspace"]
platforms = ["windows"]
command = ["python", "-B", "-m", "spring_load", "status"]

[[actions]]
id = "remove-helper-windows"
title = "Remove herdr-spring-load helper (experimental on Windows; run before herdr plugin uninstall)"
contexts = ["workspace"]
platforms = ["windows"]
command = ["python", "-B", "uninstall.py"]

[[panes]]
id = "setup"
title = "Set up herdr-spring-load"
placement = "overlay"
platforms = ["macos", "linux"]
command = ["sh", "scripts/build.sh", "--pause"]

[[panes]]
id = "setup-windows"
title = "Set up herdr-spring-load (experimental on Windows)"
placement = "overlay"
platforms = ["windows"]
command = ["python", "-B", "setup.py", "--pause"]
