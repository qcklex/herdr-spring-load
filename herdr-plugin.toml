id = "herdr-spring-load"
name = "herdr-spring-load"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Spring-loaded drag and drop: while you hold a file, hovering a space, tab or pane opens it; the terminal takes the drop"
platforms = ["macos"]

# Builds and checks the sensor, installs the core and starts the login
# service. No OS permission, no config edits. Transactional.
[[build]]
command = ["sh", "scripts/build.sh"]
platforms = ["macos"]

[[actions]]
id = "status"
title = "Spring-load helper status"
contexts = ["workspace"]
command = ["sh", "scripts/build.sh", "--status"]

[[actions]]
id = "remove-helper"
title = "Remove herdr-spring-load helper (run before herdr plugin uninstall)"
contexts = ["workspace"]
command = ["sh", "helper/uninstall.sh"]

[[panes]]
id = "setup"
title = "Set up herdr-spring-load"
placement = "overlay"
command = ["sh", "scripts/build.sh", "--pause"]
